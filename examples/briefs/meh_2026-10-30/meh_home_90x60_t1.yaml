# T1 MEH top: 1 in CD + 4 x 4 in, one per wall (C1, C10). Compact hi-fi variant.
#
# Same MEH pipeline as the T2 brief; only the driver candidates, the CD/mid crossover range,
# the MEH high-pass (160 Hz) and the SPL target change. The T1 CAD seed uses all four walls
# (walls: tblr), so its quarter mesh carries two entry_mid faces (C3).
name: meh_home_90x60_t1
description: Mini MEH top, compact hi-fi, 90x60, 16 in square face, 1 in CD + 4 x 4 in, HP 160 Hz to the bass box
driver: {exit_radius_mm: 12.7, exit_angle_deg: 0.0}
envelope: {max_mouth_w_mm: 406.4, max_mouth_h_mm: 406.4, max_depth_mm: 380.0}
symmetry: hv
source: {cap: auto}
target:
  coverage_h_deg: 90.0
  coverage_v_deg: 60.0
  band_lo_hz: 120.0
  band_hi_hz: 12000.0
  di_target_db: null
  di_slope_target: 0.0
  z_min: 0.0
  f0_hz: 850.0
weights: {cov: 1.0, rip: 0.5, di: 0.0, dislope: 0.3, flat: 0.0, load: 0.0, distd: 0.5, diag: 0.0,
          lw_resid: 0.5, notch: 1.0, xo_lob: 1.0, headroom: 1.0}
objective: {version: 5, cov_narrow_ratio: 2.0, cov_below_f0: one_sided}
meh:
  groups:
    cd:  {tag: 2,  drivers: [faitalpro_hf108]}
    mid: {tag: 10, count: 4, drivers: [bc_4ndf34, faitalpro_4fe32]}
  hp_hz: 160
  xo_hz: {lo: 1000, hi: 1500}
  xo_orders: [2, 4]
  delay_ms: {lo: -1.0, hi: 2.0}
  v_front_fill: {lo: 0.0, hi: 0.7}
  v_rear_l: {lo: 0.8, hi: 6.0}
  amp_v_rms: 40.0
  port_air_mps_max: 17.0
  max_boost_db: 6.0
  spl_target: [[160, 112], [300, 118], [12000, 118]]
  listening_window: {h_deg: [0, 10, 20, 30], v_deg: [10]}
