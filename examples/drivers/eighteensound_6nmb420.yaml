le_mh: 0.10
bl_tm: 9.0
sd_cm2: 130
xmax_mm: 3.0
p_aes_w: 200
fs_hz: 110
qms: 2.7
mms_g: 8.5
mmd_g: 6.8
cms_mm_per_n: 0.25
vas_l: 6.1
