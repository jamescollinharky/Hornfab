# B&C 6NDL38 — T2 primary mid (6.5 in; used by the JW DH350 MEH).
# Transcribed from docs/research/typologies/mini_meh_2026-10-29/appendix_A_web_survey_raw.md
# section 8(a), row labelled V (manufacturer datasheet PDF read 2026-10-29).
# C8 contract: docs/meh/00_MEH_CONTRACTS.md. Existing files are untouched.
name: B&C 6NDL38
kind: cone
source: https://www.bcspeakers.com/en/products/lf-driver/6-5/8/6ndl38.pdf
notes: >-
  Datasheet row V. Mmd and Cms are marked as derived in appendix A s8, not printed on the
  sheet: Mmd = Mms - 2*(8/3)*rho*a^3 with a = sqrt(Sd/pi), using Mms = 17 g and
  Sd = 132 cm2; Cms = Vas/(rho*c^2*Sd^2) with Vas = 7.0 L and Sd = 132 cm2.
  Rms is not carried because Qms is published. frame_od_mm / motor_od_mm / dish_mm are
  not published in the appendix A s8 table; omitted, so M5 keeps its [inferred]
  placeholders until the datasheet drawing is read. Sens is the appendix A s8
  "Sens dB" column.
derived: [mmd_g, cms_mm_per_n]
re_ohm: 5.2
le_mh: 0.60
bl_tm: 9.5
sd_cm2: 132
xmax_mm: 6.0
p_aes_w: 150
fs_hz: 72
qms: 11.5
mms_g: 17.0
mmd_g: 15.3
cms_mm_per_n: 0.28
vas_l: 7.0
cutout_mm: 145
depth_mm: 85
sens_db_2v83: 92
