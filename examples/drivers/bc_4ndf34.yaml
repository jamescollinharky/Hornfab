name: B&C 4NDF34
kind: cone
source: https://www.bcspeakers.com/en/products/lf-driver/4/8/4ndf34.pdf
notes: >-
  Datasheet row V. Mmd and Cms are marked as derived in appendix A s8, not printed on the
  sheet: Mmd = Mms - 2*(8/3)*rho*a^3 with a = sqrt(Sd/pi), using Mms = 6.1 g and
  Sd = 57 cm2; Cms = Vas/(rho*c^2*Sd^2) with Vas = 1.6 L and Sd = 57 cm2.
  Rms is not carried because Qms is published. frame_od_mm / motor_od_mm / dish_mm are
  not published in the appendix A s8 table; omitted, so M5 keeps its [inferred]
  placeholders. Sens is the appendix A s8 "Sens dB" column.
