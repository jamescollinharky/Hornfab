# B&C DH450 — T1 alternative compression driver (1 in exit; 1 kHz min XO).
# Transcribed from docs/research/typologies/mini_meh_2026-10-29/appendix_A_web_survey_raw.md
# section 8(b), row labelled V (manufacturer datasheet PDF read 2026-10-29).
# C8 contract: docs/meh/00_MEH_CONTRACTS.md. Existing files are untouched.
name: B&C DH450
kind: compression_meh
source: https://www.bcspeakers.com/en/products/hf-driver/1-0/8/DH450-8.pdf
notes: >-
  Datasheet row V. Exit 1 in = 25.4 mm. Published body size 69 mm diameter x 48 mm
  length. Sensitivity 109 dB is the appendix A s8 "Sens" column; the reference horn is
  not stated in the extracted table, so it is not named here. Power is the datasheet
  nominal/AES 20 W (continuous/program 40 W). Only Zmin = 7.8 ohm and Le = 0.16 mH are
  published, so re_ohm is omitted. The URL is abbreviated in the table as
  .../DH450-8.pdf and is expanded here to the full path used by the DH350 row.
  duct_mm (diaphragm to exit) is not shown in the appendix A s8 table: duct depth not
  published. fs_cd_hz, q_cd and di_ref_db are omitted so the C8 defaults apply
  (min_xo_hz/1.4, 1.0, 10 dB).
exit_mm: 25.4
p_aes_w: 20
min_xo_hz: 1000
sens_db_1w: 109
body_d_mm: 69
body_len_mm: 48
