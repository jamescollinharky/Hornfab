u20130.75","u \u2265 0.75"],"tones":["vis-orange","vis-blue","vis-purple","vis-yellow"],"default_key":"gcurve_sf_n2","run_id":"20261103T053926Z-screen-8b32a1","title":"Solana OSSE+SF MEH CMA-1000 \u2014 UMAP of OK designs"}</script>
<script>
(function () {
  const data = JSON.parse(document.getElementById("data").textContent);
  const paramSel = document.getElementById("param");
  const modeSel = document.getElementById("mode");
  const legend = document.getElementById("legend");
  const hint = document.getElementById("hint");
  const detail = document.getElementById("detail");
  const svg = d3.select("#chart");
  const jFmt = d3.format(".2f"), uFmt = d3.format(".3f"), pFmt = d3.format(".2f");

  document.getElementById("title").textContent = data.title;
  document.getElementById("subtitle").textContent =
    data.n_ok + " OK designs · " + data.points.length + " plotted · best ringed";
  document.getElementById("runid").textContent = data.run_id;

  data.keys.forEach(function (k) {
    const opt = document.createElement("option");
    opt.value = k; opt.textContent = k;
    if (k === data.default_key) opt.selected = true;
    paramSel.appendChild(opt);
  });

  const TONE = {
    "vis-orange": "tones-orange", "vis-blue": "tones-blue",
    "vis-purple": "tones-purple", "vis-yellow": "tones-yellow"
  };
  const J_THRESH = [
    { id: "lt9", lo: 0, hi: 9, label: "J < 9", tone: "vis-orange" },
    { id: "9_12", lo: 9, hi: 12, label: "9 ≤ J < 12", tone: "vis-blue" },
    { id: "12_16", lo: 12, hi: 16, label: "12 ≤ J < 16", tone: "vis-purple" },
    { id: "ge16", lo: 16, hi: 1e9, label: "J ≥ 16", tone: "vis-yellow" }
  ];
  const margin = { top: 20, right: 20, bottom: 44, left: 48 };
  let selected = -1;

  function phys(key, u) {
    const b = data.bounds[key];
    return b.lo + u * (b.hi - b.lo);
  }
  function paramBands(key) {
    const edges = data.unit_edges, bands = [];
    for (let i = 0; i < edges.length - 1; i++) {
      const ulo = edges[i], uhi = edges[i + 1];
      bands.push({
        id: "b" + i, ulo: ulo, uhi: uhi, tone: data.tones[i],
        label: pFmt(phys(key, ulo)) + "–" + pFmt(phys(key, Math.min(uhi, 1))) +
               " (" + data.band_labels[i] + ")"
      });
    }
    return bands;
  }
  function bandIdParam(p, key, bands) {
    const u = p.u[key];
    for (let i = 0; i < bands.length; i++) {
      if (u >= bands[i].ulo && u < bands[i].uhi) return bands[i].id;
    }
    return bands[bands.length - 1].id;
  }
  function bandIdJ(p) {
    for (let i = 0; i < J_THRESH.length; i++) {
      if (p.J >= J_THRESH[i].lo && p.J < J_THRESH[i].hi) return J_THRESH[i].id;
    }
    return J_THRESH[J_THRESH.length - 1].id;
  }
  function setLegend(bands, counts) {
    legend.innerHTML = "";
    bands.forEach(function (b) {
      const span = document.createElement("span");
      span.innerHTML = '<span class="swatch ' + TONE[b.tone] + '"></span>' +
        b.label + " (" + (counts[b.id] || 0) + ")";
      legend.appendChild(span);
    });
    const ring = document.createElement("span");
    ring.innerHTML = '<span class="swatch tones-orange"></span>best (ring)';
    legend.appendChild(ring);
  }

  function paint() {
    const key = paramSel.value;
    const mode = modeSel.value;
    const b = data.bounds[key];
    hint.textContent = key + " bounds " + pFmt(b.lo) + "–" + pFmt(b.hi) +
      (mode === "param" ? " · unit quartiles" : " · coloring by total J");

    const bands = mode === "param" ? paramBands(key) : J_THRESH;
    const toneById = {}, counts = {};
    bands.forEach(function (band) { toneById[band.id] = band.tone; counts[band.id] = 0; });
    data.points.forEach(function (p) {
      p._band = mode === "param" ? bandIdParam(p, key, bands) : bandIdJ(p);
      counts[p._band]++;
    });
    setLegend(bands, counts);

    const node = svg.node();
    const width = Math.max(320, node.clientWidth || 800);
    const height = Math.max(360, node.clientHeight || 520);
    svg.attr("viewBox", "0 0 " + width + " " + height);
    svg.selectAll("*").remove();

    const pts = data.points;
    const x = d3.scaleLinear().domain(d3.extent(pts, d => d.x)).nice()
      .range([margin.left, width - margin.right]);
    const y = d3.scaleLinear().domain(d3.extent(pts, d => d.y)).nice()
      .range([height - margin.bottom, margin.top]);

    const gGrid = svg.append("g").attr("class", "grid");
    gGrid.selectAll("line.v").data(x.ticks(5)).join("line")
      .attr("x1", d => x(d)).attr("x2", d => x(d))
      .attr("y1", margin.top).attr("y2", height - margin.bottom);
    gGrid.selectAll("line.h").data(y.ticks(5)).join("line")
      .attr("y1", d => y(d)).attr("y2", d => y(d))
      .attr("x1", margin.left).attr("x2", width - margin.right);

    svg.append("g").attr("class", "axis")
      .attr("transform", "translate(0," + (height - margin.bottom) + ")")
      .call(d3.axisBottom(x).ticks(5));
    svg.append("g").attr("class", "axis")
      .attr("transform", "translate(" + margin.left + ",0)")
      .call(d3.axisLeft(y).ticks(5));
    svg.append("text").attr("class", "label")
      .attr("x", width / 2).attr("y", height - 10)
      .attr("text-anchor", "middle").text("UMAP 1");
    svg.append("text").attr("class", "label")
      .attr("transform", "rotate(-90)")
      .attr("x", -height / 2).attr("y", 14)
      .attr("text-anchor", "middle").text("UMAP 2");

    const g = svg.append("g");
    pts.map((p, i) => ({ p, i })).sort((a, b) => b.p.J - a.p.J).forEach(function (row) {
      const p = row.p, i = row.i;
      if (p.b) return;
      const c = g.append("circle")
        .attr("class", TONE[toneById[p._band]] || "tones-blue")
        .attr("cx", x(p.x)).attr("cy", y(p.y))
        .attr("r", i === selected ? 6 : 4)
        .attr("opacity", 0.9)
        .style("cursor", "pointer");
      c.append("title").text(
        key + " u=" + uFmt(p.u[key]) + " · " + pFmt(phys(key, p.u[key])) + " · J " + jFmt(p.J)
      );
      c.on("click", function (event) {
        event.stopPropagation();
        selected = i;
        detail.hidden = false;
        detail.textContent = key + "=" + pFmt(phys(key, p.u[key])) +
          " (u " + uFmt(p.u[key]) + "), J=" + jFmt(p.J);
        paint();
      });
    });

    const best = pts.find(p => p.b);
    if (best) {
      g.append("circle")
        .attr("class", TONE[toneById[best._band]] || "tones-orange")
        .attr("cx", x(best.x)).attr("cy", y(best.y)).attr("r", 4);
      g.append("circle").attr("class", "best-ring")
        .attr("cx", x(best.x)).attr("cy", y(best.y)).attr("r", 8)
        .attr("pointer-events", "none");
    }
  }

  paramSel.addEventListener("change", function () {
    selected = -1; detail.hidden = true; paint();
  });
  modeSel.addEventListener("change", paint);
  window.addEventListener("resize", paint);
  paint();
})();
</script>
